services:
  # The game on its own server, with accounts: everyone signs in and has their own saved games.
  # The built-in "admin" account opens the admin menu (accounts, and starting, stopping and
  # setting up a Cloudflare Tunnel). Open it from any computer on your network
  # (http://<this machine>:8080). Accounts, saves and tunnel settings persist in the coop-tunnel
  # volume. Lost the admin password? docker compose exec app npm run admin:reset
  #   docker compose up --build            → http://localhost:8080
  app:
    build:
      context: .
      target: app
    init: true
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
      - TUNNEL_HOSTNAME=${TUNNEL_HOSTNAME:-}
      - COOP_ADMIN_PASSWORD=${COOP_ADMIN_PASSWORD:-}
      - ALLOWED_HOSTS=all
    volumes:
      - coop-tunnel:/data
    restart: unless-stopped

  # The plain static site on nginx (no accounts or admin menu; saves stay in each browser), reachable from other devices on your
  # network. Optional:
  #   docker compose --profile static up --build   → http://localhost:8081
  web:
    build:
      context: .
      target: web
    profiles: ["static", "tunnel", "named-tunnel"]
    ports:
      - "${HOST_PORT:-8081}:80"
    environment:
      - HOST_PORT=${HOST_PORT:-8081}
    restart: unless-stopped

  # Cloudflare Tunnel in its own container, in front of the static site. A quick tunnel needs no
  # account and prints a random https://*.trycloudflare.com address in its log:
  #   docker compose --profile tunnel up --build
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    restart: unless-stopped

  # A named tunnel on your own hostname. Create the tunnel in the Cloudflare dashboard
  # (Zero Trust > Networks > Tunnels), route its public hostname to http://web:80, and put
  # its token in .env as CLOUDFLARE_TUNNEL_TOKEN=...:
  #   docker compose --profile named-tunnel up --build -d
  tunnel-named:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["named-tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  coop-tunnel:
